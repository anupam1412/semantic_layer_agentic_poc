# ═══════════════════════════════════════════════════════════════════════════
# EXAMPLES - Few-shot SQL examples
# ═══════════════════════════════════════════════════════════════════════════
examples:
  - id: ex_lookup_1
    category: LOOKUP
    question: "What was our total revenue last month?"
    sql: |
      SELECT SUM(order_total) as revenue
      FROM `${bigquery_project}.${bigquery_dataset}.orders`
      WHERE status = 'completed'
        AND order_date >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 1 MONTH), MONTH)
        AND order_date < DATE_TRUNC(CURRENT_DATE(), MONTH)
    tables: [orders]

  - id: ex_lookup_2
    category: LOOKUP
    question: "What are the top 5 stores by revenue?"
    sql: |
      SELECT s.store_name, s.region, SUM(o.order_total) as revenue
      FROM `${bigquery_project}.${bigquery_dataset}.orders` o
      JOIN `${bigquery_project}.${bigquery_dataset}.stores` s ON o.store_id = s.store_id
      WHERE o.status = 'completed'
      GROUP BY s.store_name, s.region
      ORDER BY revenue DESC
      LIMIT 5
    tables: [orders, stores]

  - id: ex_trend_1
    category: TREND
    question: "Show revenue trend for the past 6 months"
    sql: |
      SELECT 
        FORMAT_DATE('%Y-%m', order_date) as month,
        SUM(order_total) as revenue
      FROM `${bigquery_project}.${bigquery_dataset}.orders`
      WHERE status = 'completed'
        AND order_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 6 MONTH)
      GROUP BY 1
      ORDER BY 1
    tables: [orders]

  - id: ex_compare_1
    category: ENTITY_COMPARE
    question: "Compare revenue between London and Manchester"
    sql: |
      SELECT 
        s.region,
        SUM(o.order_total) as revenue,
        COUNT(DISTINCT o.order_id) as orders
      FROM `${bigquery_project}.${bigquery_dataset}.orders` o
      JOIN `${bigquery_project}.${bigquery_dataset}.stores` s ON o.store_id = s.store_id
      WHERE o.status = 'completed'
        AND s.region IN ('London', 'North West')
      GROUP BY s.region
    tables: [orders, stores]

  - id: ex_segment_1
    category: SEGMENT_COMPARE
    question: "How does enterprise segment compare to smb?"
    sql: |
      SELECT 
        c.segment,
        COUNT(DISTINCT o.order_id) as orders,
        SUM(o.order_total) as revenue,
        AVG(o.order_total) as aov
      FROM `${bigquery_project}.${bigquery_dataset}.orders` o
      JOIN `${bigquery_project}.${bigquery_dataset}.customers` c ON o.customer_id = c.customer_id
      WHERE o.status = 'completed'
        AND c.segment IN ('enterprise', 'smb')
      GROUP BY c.segment
    tables: [orders, customers]

  - id: ex_period_1
    category: PERIOD_COMPARE
    question: "How did Q1 compare to Q4 last year?"
    sql: |
      SELECT 
        CASE 
          WHEN order_date BETWEEN '2025-01-01' AND '2025-03-31' THEN 'Q1 2025'
          WHEN order_date BETWEEN '2024-10-01' AND '2024-12-31' THEN 'Q4 2024'
        END as period,
        SUM(order_total) as revenue
      FROM `${bigquery_project}.${bigquery_dataset}.orders`
      WHERE status = 'completed'
        AND order_date BETWEEN '2024-10-01' AND '2025-03-31'
      GROUP BY 1
    tables: [orders]

  - id: ex_margin_1
    category: LOOKUP
    question: "What is our gross margin by category?"
    sql: |
      SELECT 
        p.category,
        SAFE_DIVIDE(SUM(oi.line_total - (p.cost * oi.quantity)), SUM(oi.line_total)) as gross_margin
      FROM `${bigquery_project}.${bigquery_dataset}.order_items` oi
      JOIN `${bigquery_project}.${bigquery_dataset}.products` p ON oi.product_id = p.product_id
      GROUP BY p.category
      ORDER BY gross_margin DESC
    tables: [order_items, products]

  - id: ex_promo_1
    category: LOOKUP
    question: "Which promotions had the best ROI?"
    sql: |
      SELECT 
        pr.promo_name,
        pr.promo_type,
        SUM(o.order_total) as promo_revenue,
        pr.budget_usd,
        SAFE_DIVIDE(SUM(o.order_total) - pr.budget_usd, pr.budget_usd) as roi
      FROM `${bigquery_project}.${bigquery_dataset}.orders` o
      JOIN `${bigquery_project}.${bigquery_dataset}.promotions` pr ON o.promo_id = pr.promo_id
      WHERE o.status = 'completed'
      GROUP BY pr.promo_name, pr.promo_type, pr.budget_usd
      ORDER BY roi DESC
      LIMIT 10
    tables: [orders, promotions]