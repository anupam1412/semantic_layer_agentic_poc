# ─────────────────────────────────────────────────────────────────────────────
# LAYER 9: Business Rules
# ─────────────────────────────────────────────────────────────────────────────
discount_policies:
  - category: "Electronics"
    max_pct: 25
    approved_by: "VP Sales"
  
  - category: "Software"
    max_pct: 30
    approved_by: "VP Sales"
  
  - category: "Services"
    max_pct: 15
    approved_by: "VP Services"
  
  - category: "Accessories"
    max_pct: 40
    store_type: "outlet"
    approved_by: "Merchandising"

pricing_decisions:
  - category: "Analytics"
    action: "-20% price reduction on Analytics subcategory"
    reason: "Match new VC-funded competitor NewCo"
    date: "2025-03-01"
    scope: "new_customers_only"
  
  - category: "Analytics"
    action: "Extended free trial from 14 to 30 days"
    reason: "Competitive response — reduce barrier to trial"
    date: "2025-04-01"
    scope: "all"
  
  - category: "Electronics"
    action: "Black Friday 30% + simultaneous clearance 20% on same category"
    reason: "Unintended overlap — clearance scheduled before BF dates confirmed"
    date: "2025-11-20"
    scope: "all_channels"

segment_rules:
  - segment: "enterprise"
    metric: "annual_spend"
    condition: ">= 50000"
    description: "Enterprise: annual spend >= 50K, dedicated account manager"
  
  - segment: "mid-market"
    metric: "annual_spend"
    condition: ">= 10000"
    description: "Mid-market: annual spend 10K-50K, shared account manager"
  
  - segment: "smb"
    metric: "annual_spend"
    condition: "< 10000"
    description: "SMB: annual spend < 10K, self-service, price-sensitive"

