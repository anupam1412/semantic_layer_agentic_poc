# ===========================================================================
# SECTION 4 - SCHEMA MAPPING
# ===========================================================================
schema_mapping:

  entity_mappings:
    - { entity: cell,              bq_table: cells,            bq_pk: cell_id,       kg_label: KGCell }
    - { entity: tower,             bq_table: towers,           bq_pk: tower_id,      kg_label: KGTower }
    - { entity: network_cluster,   bq_table: network_clusters, bq_pk: cluster_id,    kg_label: KGCluster }
    - { entity: region,            bq_table: regions,          bq_pk: region_id,     kg_label: KGRegion }
    - { entity: subscriber,        bq_table: subscribers,      bq_pk: subscriber_id, kg_label: KGSubscriber }
    - { entity: device,            bq_table: devices,          bq_pk: device_id,     kg_label: null }
    - { entity: network_equipment, bq_table: null,             bq_pk: null,          kg_label: KGEquipment }

  kpi_table_dependencies:
    - { kpi: call_drop_rate,           primary: call_events,          joins: [] }
    - { kpi: call_setup_success_rate,  primary: call_events,          joins: [] }
    - { kpi: handover_success_rate,    primary: network_measurements, joins: [] }
    - { kpi: radio_link_failure_rate,  primary: call_events,          joins: [] }
    - { kpi: interference_drop_rate,   primary: call_events,          joins: [] }
    - { kpi: avg_rsrp,                 primary: network_measurements, joins: [] }
    - { kpi: avg_sinr,                 primary: network_measurements, joins: [] }
    - { kpi: prb_utilisation,          primary: network_measurements, joins: [] }
    - { kpi: avg_throughput,           primary: network_measurements, joins: [] }
    - { kpi: congestion_rate,          primary: network_measurements, joins: [] }
    - { kpi: network_availability,     primary: call_events,          joins: [] }
    - { kpi: cdr_target_attainment,    primary: call_events,          joins: [network_kpi_targets] }
    - { kpi: subscriber_affected_rate, primary: call_events,          joins: [subscribers] }
    - { kpi: repeat_drop_rate,         primary: call_events,          joins: [subscribers] }
    - { kpi: ping_pong_rate,           primary: handover_events,      joins: [] }
    - { kpi: congestion_persistence,   primary: network_measurements, joins: [] }
    - { kpi: capacity_vs_design,       primary: network_measurements, joins: [cells] }
    - { kpi: cdr_spike_ratio,          primary: call_events,          joins: [] }
    - { kpi: vendor_concentration,     primary: cells,                joins: [] }
    - { kpi: outage_duration,          primary: call_events,          joins: [] }
    - { kpi: churn_risk_concentration, primary: subscribers,          joins: [] }


# ===========================================================================
# SECTION 5 - EXAMPLES
# ===========================================================================
examples:

  sql:

    - id: lookup_kpi_global
      category: LOOKUP
      question: "What is the call drop rate this week?"
      sql: |
        SELECT
          SAFE_DIVIDE(
            COUNTIF(call_outcome = 'dropped'),
            COUNTIF(call_outcome IN ('completed','dropped'))) * 100  AS cdr_pct,
          COUNTIF(call_outcome IN ('completed','dropped'))           AS call_volume
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events`
        WHERE call_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)

    - id: drilldown_by_cell
      category: LOOKUP
      question: "Break CDR by cell for a given region today"
      sql: |
        SELECT
          ce.cell_id,
          c.technology,
          c.vendor,
          SAFE_DIVIDE(
            COUNTIF(ce.call_outcome = 'dropped'),
            COUNTIF(ce.call_outcome IN ('completed','dropped'))) * 100   AS cdr_pct,
          COUNTIF(ce.call_outcome IN ('completed','dropped'))            AS call_volume
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events` ce
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.cells` c
          ON ce.cell_id = c.cell_id
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.regions` r
          ON ce.region_id = r.region_id
        WHERE ce.call_date = CURRENT_DATE()
          AND r.region_name = @region_name
        GROUP BY ce.cell_id, c.technology, c.vendor
        HAVING COUNTIF(ce.call_outcome IN ('completed','dropped')) >= 50
        ORDER BY cdr_pct DESC

    - id: driver_kpis_for_cell
      category: LOOKUP
      question: "Show all driver KPIs for a specific cell today"
      sql: |
        SELECT
          ROUND(AVG(avg_rsrp_dbm), 1)                         AS avg_rsrp,
          ROUND(AVG(avg_sinr_db), 1)                          AS avg_sinr,
          ROUND(AVG(prb_utilisation_pct), 1)                  AS avg_prb,
          ROUND(SAFE_DIVIDE(SUM(handover_success),
                            SUM(handover_attempts)) * 100, 1) AS hosr,
          ROUND(AVG(avg_throughput_mbps), 1)                  AS avg_throughput
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.network_measurements`
        WHERE measurement_date = CURRENT_DATE()
          AND cell_id = @cell_id

    - id: period_compare
      category: PERIOD_COMPARE
      question: "How does this week's CDR compare to last week by technology?"
      sql: |
        SELECT
          CASE
            WHEN call_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY) THEN 'this_week'
            ELSE 'last_week'
          END                                                             AS period,
          technology,
          SAFE_DIVIDE(
            COUNTIF(call_outcome = 'dropped'),
            COUNTIF(call_outcome IN ('completed','dropped'))) * 100       AS cdr_pct
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events`
        WHERE call_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 14 DAY)
        GROUP BY period, technology
        ORDER BY technology, period

    - id: trend_daily
      category: TREND
      question: "Show CDR trend by day for a region over the last 30 days"
      sql: |
        SELECT
          ce.call_date,
          SAFE_DIVIDE(
            COUNTIF(ce.call_outcome = 'dropped'),
            COUNTIF(ce.call_outcome IN ('completed','dropped'))) * 100   AS cdr_pct
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events` ce
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.regions` r
          ON ce.region_id = r.region_id
        WHERE ce.call_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
          AND r.region_name = @region_name
        GROUP BY ce.call_date
        ORDER BY ce.call_date

    - id: root_cause_drop_reason
      category: ROOT_CAUSE
      question: "What are the top drop reasons this week?"
      sql: |
        SELECT
          drop_reason,
          COUNT(*) AS drop_count,
          SAFE_DIVIDE(COUNT(*), SUM(COUNT(*)) OVER ()) * 100 AS pct_of_drops
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events`
        WHERE call_outcome = 'dropped'
          AND call_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
        GROUP BY drop_reason
        ORDER BY drop_count DESC

    - id: root_cause_drop_reason_by_region
      category: ROOT_CAUSE
      question: "What are the top drop reasons in a specific region?"
      sql: |
        SELECT
          ce.drop_reason,
          COUNT(*) AS drop_count,
          SAFE_DIVIDE(COUNT(*), SUM(COUNT(*)) OVER ()) * 100 AS pct_of_drops
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events` ce
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.regions` r
          ON ce.region_id = r.region_id
        WHERE ce.call_outcome = 'dropped'
          AND r.region_name = @region_name
          AND ce.call_date BETWEEN @start_date AND @end_date
        GROUP BY ce.drop_reason
        ORDER BY drop_count DESC

    - id: entity_compare
      category: ENTITY_COMPARE
      question: "Compare CDR between two regions over the last 30 days"
      sql: |
        SELECT
          r.region_name,
          r.region_type,
          SAFE_DIVIDE(
            COUNTIF(ce.call_outcome = 'dropped'),
            COUNTIF(ce.call_outcome IN ('completed','dropped'))) * 100   AS cdr_pct,
          SAFE_DIVIDE(
            COUNTIF(ce.call_outcome IN ('completed','dropped')),
            COUNT(*)) * 100                                              AS cssr_pct,
          COUNT(*)                                                       AS total_attempts
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events` ce
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.regions` r
          ON ce.region_id = r.region_id
        WHERE ce.call_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
          AND r.region_name IN (@region_a, @region_b)
        GROUP BY r.region_name, r.region_type

    - id: subscriber_impact
      category: SEGMENT_COMPARE
      question: "What share of subscribers experienced a drop today by segment?"
      sql: |
        SELECT
          s.segment,
          s.loyalty_tier,
          COUNT(DISTINCT ce.subscriber_id)                                 AS total_subs,
          COUNT(DISTINCT CASE WHEN ce.call_outcome = 'dropped'
                              THEN ce.subscriber_id END)                   AS affected_subs,
          SAFE_DIVIDE(
            COUNT(DISTINCT CASE WHEN ce.call_outcome = 'dropped'
                                THEN ce.subscriber_id END),
            COUNT(DISTINCT ce.subscriber_id)) * 100                        AS affected_pct,
          ROUND(AVG(s.churn_risk_score), 3)                                AS avg_churn_risk
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events` ce
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.subscribers` s
          ON ce.subscriber_id = s.subscriber_id
        WHERE ce.call_date = CURRENT_DATE()
        GROUP BY s.segment, s.loyalty_tier
        ORDER BY affected_pct DESC

    - id: cdr_target_attainment
      category: LOOKUP
      question: "Which regions are breaching their CDR targets this month?"
      sql: |
        SELECT
          r.region_name,
          t.technology,
          ROUND(SAFE_DIVIDE(
            COUNTIF(ce.call_outcome = 'dropped'),
            COUNTIF(ce.call_outcome IN ('completed','dropped'))) * 100, 2) AS actual_cdr,
          MAX(t.target_cdr)                                                 AS target_cdr,
          SAFE_DIVIDE(
            SAFE_DIVIDE(COUNTIF(ce.call_outcome = 'dropped'),
                        COUNTIF(ce.call_outcome IN ('completed','dropped'))) * 100,
            MAX(t.target_cdr))                                              AS attainment_ratio
        FROM `${meta.bigquery.project}.${meta.bigquery.dataset}.call_events` ce
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.regions` r
          ON ce.region_id = r.region_id
        JOIN `${meta.bigquery.project}.${meta.bigquery.dataset}.network_kpi_targets` t
          ON r.region_id = t.region_id
         AND ce.technology = t.technology
         AND FORMAT_DATE('%Y-%m', ce.call_date) = FORMAT_DATE('%Y-%m', t.target_month)
        WHERE t.target_month = DATE_TRUNC(CURRENT_DATE(), MONTH)
        GROUP BY r.region_name, t.technology
        HAVING attainment_ratio > 1.0
        ORDER BY attainment_ratio DESC


  cypher:

    - id: active_events_broad_scan
      intent: "All active events on offender cell, tower and cluster"
      cypher: |
        MATCH (c:KGCell {cell_id: $cell_id})
        OPTIONAL MATCH (c)-[:IMPACTED_BY]->(cev:KGEvent {is_resolved:false})
        OPTIONAL MATCH (c)<-[:HAS_CELL]-(t:KGTower)
                        -[:IMPACTED_BY]->(tev:KGEvent {is_resolved:false})
        OPTIONAL MATCH (t)-[:PART_OF_CLUSTER]->(cl:KGCluster)
                        -[:IMPACTED_BY]->(clev:KGEvent {is_resolved:false})
        RETURN
          collect(DISTINCT {type:cev.event_type, severity:cev.severity,
                            since:cev.start_date, scope:'cell'})     AS cell_events,
          collect(DISTINCT {type:tev.event_type, severity:tev.severity,
                            since:tev.start_date, scope:'tower'})    AS tower_events,
          collect(DISTINCT {type:clev.event_type, severity:clev.severity,
                            since:clev.start_date, scope:'cluster'}) AS cluster_events

    - id: interference_structural_check
      intent: "Check active INTERFERES_WITH edges on offender cell"
      cypher: |
        MATCH (c:KGCell {cell_id: $cell_id})
              <-[i:INTERFERES_WITH]-(src:KGCell)
        WHERE i.is_active = true
        RETURN src.cell_id,
               src.technology,
               src.band_mhz,
               i.interference_type,
               i.interference_db
        ORDER BY i.interference_db DESC

    - id: neighbour_gap_check
      intent: "Count active neighbours to detect NRT gaps"
      cypher: |
        MATCH (c:KGCell {cell_id: $cell_id})
        OPTIONAL MATCH (c)-[n:NEIGHBOURS]->(nbr:KGCell)
          WHERE n.is_active_neighbour = true
            AND nbr.technology = c.technology
        RETURN c.cell_id,
               count(nbr)           AS active_neighbour_count,
               collect(nbr.cell_id) AS neighbours

    - id: tower_full_impact_chain
      intent: "Full equipment, cell and event chain for a tower"
      cypher: |
        MATCH (t:KGTower {tower_name: $tower_name})
              -[:HAS_CELL]->(c:KGCell)
        OPTIONAL MATCH (c)-[:EQUIPPED_WITH]->(eq:KGEquipment)
        OPTIONAL MATCH (c)-[:IMPACTED_BY]->(cev:KGEvent {is_resolved:false})
        OPTIONAL MATCH (t)-[:IMPACTED_BY]->(tev:KGEvent {is_resolved:false})
        RETURN t.tower_name                       AS tower,
               c.cell_id                           AS cell,
               c.technology                        AS tech,
               collect(DISTINCT eq.equipment_type) AS equipment,
               collect(DISTINCT cev.event_type)    AS cell_events,
               collect(DISTINCT tev.event_type)    AS tower_events

    - id: cluster_risk_scan
      intent: "Scan all towers and cells in a cluster for active events"
      cypher: |
        MATCH (cl:KGCluster {cluster_name: $cluster_name})
              <-[:PART_OF_CLUSTER]-(t:KGTower)
              -[:HAS_CELL]->(c:KGCell)
        OPTIONAL MATCH (c)-[:IMPACTED_BY]->(cev:KGEvent {is_resolved:false})
        OPTIONAL MATCH (t)-[:IMPACTED_BY]->(tev:KGEvent {is_resolved:false})
        RETURN t.tower_name                       AS tower,
               c.cell_id                           AS cell,
               c.technology                        AS tech,
               collect(DISTINCT cev.event_type)    AS cell_events,
               collect(DISTINCT tev.event_type)    AS tower_events
        ORDER BY t.tower_name, c.technology

    - id: high_risk_subscriber_cells
      intent: "Cells serving high-churn-risk subscribers with active events"
      cypher: |
        MATCH (sub:KGSubscriber)-[:SERVED_BY]->(c:KGCell)
        WHERE sub.churn_risk_score >= 0.6
        OPTIONAL MATCH (c)-[:IMPACTED_BY]->(ev:KGEvent {is_resolved:false})
        RETURN c.cell_id,
               c.technology,
               count(sub)                      AS high_risk_subs,
               avg(sub.churn_risk_score)        AS avg_churn_risk,
               collect(DISTINCT ev.event_type)  AS active_events
        ORDER BY high_risk_subs DESC
        LIMIT 10

    - id: causal_chain_trace
      intent: "Trace full causal chain from a KGEvent to downstream concepts"
      cypher: |
        MATCH (ev:KGEvent {event_id: $event_id})
              -[:EVENT_INSTANCE_OF]->(oe:OntEvent)
              -[:TRIGGERS]->(c1:OntConcept)
        OPTIONAL MATCH (c1)-[:CAUSES*1..4]->(c2:OntConcept)
        RETURN oe.event_type_id                  AS event_type,
               collect(DISTINCT c1.concept_id)   AS directly_triggered,
               collect(DISTINCT c2.concept_id)   AS downstream_concepts

    - id: nlu_concept_match
      intent: "Match user query to concept via synonyms (NLU step)"
      cypher: |
        MATCH (c:OntConcept)
        WHERE any(s IN c.synonyms WHERE toLower(s) CONTAINS toLower($query))
        RETURN c.concept_id, c.display_name
        ORDER BY c.concept_id
        LIMIT 5